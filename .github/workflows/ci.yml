# The suite (node tools/run-all.js) on every pull request and every push to main, and on a push to main (a merge) whose
# suite passes, a deploy of that commit to https://next.overdubstudio.com. Run workflow (Actions > ci) on main does the
# same by hand; on any other branch it runs nothing. Node comes from mise.toml, as it does locally.
#
# macOS on Apple Silicon, on purpose: tools/golden.json was made on Apple Silicon with Node 24, and another V8 rounds
# Math.exp/sin differently in the last bit (CLAUDE.md), so the golden renders only match there.
#
# The suite needs three things the repo doesn't carry (zero dependencies, no build), set up by
# .github/actions/suite-setup:
#   - playwright-core and its Chromium, WebKit and Firefox for the browser checks (tools/pw.js, compat-test), installed
#     with --no-save;
#   - the sampled kits (app/kits/, gitignored), built by tools/fetch-kits.js from pinned upstream files;
#   - the kit HEAD~1 names as well: analytics-test dry-runs deploy.sh --next HEAD~1, and deploy.sh refuses a ref
#     whose kit isn't built.
# The deploy job reaches AWS through GitHub's OIDC token: no keys are stored anywhere. The role it assumes can only
# write the next.overdubstudio.com bucket and invalidate its distribution, and only a run on main may assume it
# (deploy/next/github-oidc.sh makes it). Its ARN and the distribution id are repository variables (NEXT_DEPLOY_ROLE,
# NEXT_DISTRIBUTION), never committed.
# Actions are pinned to a commit; the comment names the release.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to https://next.overdubstudio.com once the suite passes (main only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # by event too, so a by-hand run and a merge to main don't replace each other
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_CORE_VERSION: 1.63.0
  # The real-time suites: they time things against the wall clock (count-in clicks, frame rates, tap tempo, timers,
  # touch drags, the feedback guard, a 60 s render timeout, "Stop ends the turn at once", a knob gesture or keys
  # recorded against the running transport). They pass on a Mac but fail on GitHub's slow macOS VMs, a different few
  # each run, even one suite at a time. So they run in the realtime job, which shows its result but blocks neither the
  # merge nor the deploy; every other suite runs in the test job, which does. Whole file names, space-separated. Move
  # a suite here only for timing failures, never a deterministic one.
  REALTIME_SUITES: >-
    agent-test.js arrange-test.js autorec-test.js brand-test.js engine-test.js grooves-test.js input-test.js
    jam-test.js mcp-e2e-test.js phone-test.js plugin-test.js record-test.js sketch-rec-test.js sounds-test.js

jobs:
  # TEMPORARY: what the runner gives a test browser, headless and headed
  diag:
    runs-on: macos-15
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [headless, headed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite-setup
      - name: Quiet the machine, and the display
        run: |
          sudo mdutil -a -i off || true
          system_profiler SPDisplaysDataType || true
          node node_modules/playwright-core/cli.js install chromium
      - name: Probe
        run: |
          [ "${{ matrix.mode }}" = headed ] && export HEADED=1
          node tools/ci-probe.js
      - name: Suites
        if: always()
        env:
          PAR: 1
          CPU: 0
        run: |
          [ "${{ matrix.mode }}" = headed ] && export HEADED=1
          top -l 0 -s 15 -o cpu -n 8 -stats command,cpu,threads > top.log &
          node tools/run-all.js arrange-test.js brand-test.js engine-test.js input-test.js stopping-test.js plugin-test.js phone-test.js sounds-test.js || true
          kill %1 || true
          grep -A9 '^COMMAND' top.log | awk '{print $1, $2}' | sort | awk '{a[$1]+=$2; n[$1]++} END {for (k in a) printf "%s %.1f\n", k, a[k]/n[k]}' | sort -k2 -nr | head -15

  # Every suite but the real-time ones, about 40 minutes one suite at a time, split four ways: each lands in exactly
  # one shard (round-robin by name), and each shard runs its suites one at a time.
  test:
    name: test (${{ matrix.shard }}/4)
    if: github.event_name == 'never'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/suite-setup
        with:
          previous-kit: true

      - name: This shard's suites (node tools/run-all.js <names>)
        env:
          SHARD: ${{ matrix.shard }}
          REQUIRE_ALL: 1   # compat-test fails, rather than skips, a browser that didn't install
          PAR: 1           # one suite at a time, so timings measure the suite and not its neighbours
          # Skips the CPU-budget timings (timbre, wavetable, studioa, instruments3): on a shared VM they measure the
          # neighbours, and strings and choir sit within 1% of their 6% budget. Every other check still runs.
          CPU: 0
        run: |
          read -ra realtime <<< "$REALTIME_SUITES"
          for f in "${realtime[@]}"; do
            [ -f "tools/$f" ] || { echo "::error::REALTIME_SUITES names $f, which isn't in tools/"; exit 1; }
          done
          # run-all takes a whole file name as exactly that file
          names=()
          while IFS= read -r f; do names+=("$f"); done < <(
            cd tools && printf '%s\n' *-test.js | LC_ALL=C sort | grep -vxF -f <(printf '%s\n' "${realtime[@]}") \
              | awk -v k="$SHARD" '(NR - 1) % 4 == k')
          echo "shard $SHARD: ${names[*]}"
          node tools/run-all.js "${names[@]}"

      - name: Keep the screenshots and reports when it fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-out-${{ matrix.shard }}
          path: |
            tools/.out/
            !tools/.out/kits-cache/
          retention-days: 7

  # The real-time suites (REALTIME_SUITES), one at a time. continue-on-error, and neither suite nor deploy-staging
  # needs it: its result is there to read, not to gate on.
  realtime:
    if: github.event_name == 'never'
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/suite-setup

      - name: The real-time suites (node tools/run-all.js <names>)
        env:
          REQUIRE_ALL: 1
          PAR: 1
          CPU: 0
        run: |
          read -ra realtime <<< "$REALTIME_SUITES"
          node tools/run-all.js "${realtime[@]}"

      - name: Keep the screenshots and reports when it fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-out-realtime
          path: |
            tools/.out/
            !tools/.out/kits-cache/
          retention-days: 7

  # One status for branch protection to require, whatever the shard count.
  suite:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.test.result }}
        run: '[ "$RESULT" = success ] || { echo "the suite: $RESULT"; exit 1; }'

  deploy-staging:
    needs: test
    # a merge to main, or a by-hand run on main that asked for it; the role trusts main only
    # (deploy/next/github-oidc.sh, BRANCHES)
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      AWS_ROLE: ${{ vars.NEXT_DEPLOY_ROLE }}
      NEXT_DISTRIBUTION: ${{ vars.NEXT_DISTRIBUTION }}
    steps:
      - name: Check the repository variables are set (deploy/next/github-oidc.sh says what goes in them)
        run: |
          [ -n "$AWS_ROLE" ] || { echo "::error::set the repository variable NEXT_DEPLOY_ROLE"; exit 1; }
          [ -n "$NEXT_DISTRIBUTION" ] || { echo "::error::set the repository variable NEXT_DISTRIBUTION"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Cache the kit downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.out/kits-cache
          key: kits-cache-${{ hashFiles('tools/fetch-kits.js', 'app/src/devices/builtin/*.js') }}
          restore-keys: kits-cache-

      - name: Build the sampled kits this commit names
        run: node tools/fetch-kits.js

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: us-east-1

      - name: Deploy to https://next.overdubstudio.com (the test job already passed)
        run: |
          echo "$NEXT_DISTRIBUTION" > deploy/.next-distribution-id
          deploy/deploy.sh --skip-tests --next "$GITHUB_SHA"
