# What the suite needs that the repo doesn't carry (zero dependencies, no build), for the test job in ci.yml, on an
# Ubuntu runner. Run it after actions/checkout.
name: suite setup
description: Node from mise.toml, playwright-core and its browsers, and the sampled kits
inputs:
  previous-kit:
    description: Also build the kit HEAD~1 names (analytics-test dry-runs deploy.sh --next HEAD~1; needs fetch-depth 2)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

    - name: Cache the browsers playwright-core drives
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_CORE_VERSION }}

    # Chromium for the studio's checks (tools/pw.js), WebKit for phone-test and compat-test, Firefox for compat-test and
    # relay-test. --with-deps: their system libraries and fonts too (apt), every run, since the cache holds only the
    # browsers. tools/pw.js looks for Chromium in macOS's cache only, so CHROMIUM names this one.
    - name: Install playwright-core and its browsers (not saved to package.json)
      shell: bash
      run: |
        npm i --no-save "playwright-core@$PLAYWRIGHT_CORE_VERSION"
        node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell webkit firefox
        shell=$(find ~/.cache/ms-playwright -path '*chromium_headless_shell-*' -name chrome-headless-shell -type f | head -1)
        [ -x "$shell" ] || { echo "::error::no chrome-headless-shell under ~/.cache/ms-playwright"; exit 1; }
        echo "CHROMIUM=$shell" >> "$GITHUB_ENV"

    # Firefox on Linux plays and records through PulseAudio. The runner has no sound server, and without one Firefox's
    # AudioContext never starts: compat-test's demo was silent, its take empty, and then it hung. This one has a null
    # sink and its own socket, which compat-test hands to Firefox alone (FIREFOX_PULSE_SERVER): Chromium stays on its
    # fake output, which its real-time checks are timed against (through PulseAudio, brand and input fail).
    - name: A sound server with no speakers, for Firefox alone (PulseAudio, a null sink)
      shell: bash
      run: |
        sudo apt-get install -y -qq --no-install-recommends pulseaudio > /dev/null
        # nothing starts a server on the usual socket for Chromium to find
        mkdir -p ~/.config/pulse && echo 'autospawn = no' > ~/.config/pulse/client.conf
        systemctl --user stop pulseaudio.socket pulseaudio.service 2> /dev/null || true
        sock="$RUNNER_TEMP/firefox-pulse"
        pulseaudio --daemonize=yes --exit-idle-time=-1 -n \
          --load="module-native-protocol-unix socket=$sock" --load=module-null-sink
        pactl -s "unix:$sock" info | grep 'Default Sink'
        echo "FIREFOX_PULSE_SERVER=unix:$sock" >> "$GITHUB_ENV"
        [ ! -e "${XDG_RUNTIME_DIR:-/run/user/$UID}/pulse/native" ] || { echo "::error::a PulseAudio server is on the usual socket"; exit 1; }

    - name: Cache the kit downloads (content-addressed, so any older cache is a valid start)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tools/.out/kits-cache
        key: kits-cache-${{ hashFiles('tools/fetch-kits.js', 'app/src/devices/builtin/*.js') }}
        restore-keys: kits-cache-

    - name: Build the sampled kits this commit names
      shell: bash
      run: node tools/fetch-kits.js

    - name: Build the sampled kits HEAD~1 names
      if: inputs.previous-kit == 'true'
      shell: bash
      run: |
        PREV="$RUNNER_TEMP/prev"
        git worktree add --detach "$PREV" HEAD~1
        mkdir -p "$PREV/tools/.out"
        ln -s "$PWD/tools/.out/kits-cache" "$PREV/tools/.out/kits-cache"
        (cd "$PREV" && node tools/fetch-kits.js)
        cp -n "$PREV"/app/kits/*.odk app/kits/ || true
        git worktree remove --force "$PREV"
        ls -l app/kits
